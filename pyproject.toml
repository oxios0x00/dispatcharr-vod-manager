[tool.ruff]
target-version = "py313"
extend-exclude = ["scripts"]

[tool.ruff.lint]
# Real bugs only (pyflakes + syntax errors) — no style/formatting nitpicks.
select = ["F", "E9"]

[tool.pytest.ini_options]
# Only tests/ — scripts/ (gitignored, ad hoc Django-shell scripts) is not
# a test suite, but its filenames can look like one to pytest's discovery.
testpaths = ["tests"]
