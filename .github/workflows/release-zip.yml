name: Attach release zip

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-and-attach:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
      - run: python3 tools/build_release_zip.py "${{ github.event.release.tag_name }}" --out vod_manager.zip
      - run: gh release upload "${{ github.event.release.tag_name }}" vod_manager.zip
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
