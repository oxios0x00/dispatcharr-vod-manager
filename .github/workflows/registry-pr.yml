# Opens the Dispatcharr/Plugins registry PR for each published release.
#
# The registry needs one PR per version (it only holds plugin.json); its own
# workflow merges a pure version bump once validation passes. This runs
# tools/registry_bump.py, which builds the manifest from the release tag and
# pushes a branch to the fork before opening the PR against Dispatcharr/Plugins.
#
# Needs a repository secret REGISTRY_PAT: a classic personal access token of the
# fork's owner with the public_repo scope. Without it the job does nothing.
name: Registry PR

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag, e.g. v1.3.3"
        required: true

permissions:
  contents: read

jobs:
  registry:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ secrets.REGISTRY_PAT }}
    steps:
      - name: Check the token is set
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::REGISTRY_PAT is not set; no registry PR was opened for $TAG."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/checkout@v4
        with:
          repository: oxios0x00/Plugins
          token: ${{ secrets.REGISTRY_PAT }}
          path: registry
          fetch-depth: 0

      - name: Point the fork at the upstream registry
        working-directory: registry
        run: |
          git remote add upstream https://github.com/Dispatcharr/Plugins.git
          git config user.name "oxios0x00"
          git config user.email "oxios0x00@users.noreply.github.com"

      - name: Wait for the release ZIP
        run: |
          url="https://github.com/oxios0x00/dispatcharr-vod-manager/releases/download/$TAG/vod_manager.zip"
          for i in $(seq 1 30); do
            if curl -fsIL "$url" > /dev/null; then exit 0; fi
            sleep 10
          done
          echo "::error::$url is not reachable"
          exit 1

      - name: Open the registry PR
        run: python3 tools/registry_bump.py vod-manager "$TAG" --repo . --registry registry --push
